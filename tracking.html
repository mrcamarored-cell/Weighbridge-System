<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Tracking</title>
<script type="module">
import { requireAuth, signOut, auth, db, collection, query, orderBy, limit, onSnapshot, getDocs }
  from "./firebase-config.js";

let trackVessel = "";

requireAuth(async (user, profile) => {
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  try {
    const s = await getDocs(collection(db, "settings"));
    if (!s.empty) trackVessel = s.docs[0].data().currentVessel || "";
  } catch (e) { console.error(e); }
  const vEl = document.getElementById("trackVesselName");
  if (vEl) vEl.textContent = trackVessel || "(no vessel selected)";
  startListening();
});
document.getElementById("logoutBtn").addEventListener("click", async () => { if(confirm("Sign out?")){ await signOut(auth); window.location.href="index.html"; }});
document.getElementById("backBtn").addEventListener("click", () => window.location.href = "dashboard.html");

const statusColors = {
  "Truck In": "#fefcbf", "Loading Complete": "#bee3f8", "Truck Out": "#feebc8", "Completed": "#c6f6d5", "Reversed": "#e2e8f0"
};
const statusText = {
  "Truck In": "🟡 Truck In", "Loading Complete": "🔵 Loaded", "Truck Out": "🟠 PGI Done", "Completed": "🟢 Completed", "Reversed": "⚫ Reversed"
};

function startListening() {
  const q = query(collection(db, "deliveries"), orderBy("createdAt", "desc"), limit(100));
  onSnapshot(q, (snap) => {
    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";
    let totalWeight = 0, totalBags = 0, count = 0;

    if (snap.empty) { tbody.innerHTML = "<tr><td colspan='7'>No records</td></tr>"; return; }

    snap.forEach(d => {
      const r = d.data();
      if ((r.vessel || "") !== trackVessel) return;   // current vessel only
      if (r.status === "Truck Out" || r.status === "Completed") {
        count++;
        totalWeight += Number(r.netWeight) || 0;
        totalBags += Number(r.numberOfBags) || 0;
      }

      const date = r.createdAt ? r.createdAt.toDate().toLocaleString("en-US") : "—";
      const tr = document.createElement("tr");
      tr.style.background = statusColors[r.status] || "#fff";
      tr.innerHTML = `
        <td>${r.deliveryNo || ""}</td>
        <td>${r.truckNumber || ""}</td>
        <td>${statusText[r.status] || r.status}</td>
        <td>${r.numberOfBags || 0}</td>
        <td>${((Number(r.netWeight)||0)/1000).toFixed(3)}</td>
        <td>${r.transporter || ""}</td>
        <td>${date}</td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("totalCount").textContent = count;
    document.getElementById("totalWeight").textContent = (totalWeight/1000).toFixed(2);
    document.getElementById("totalBags").textContent = totalBags;
  });
}
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
body { background:#f4f6f9; min-height:100vh; }
#loadingScreen { display:flex; align-items:center; justify-content:center; height:100vh; color:#718096; }
#mainContent { display:none; }
header { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header h1{ font-size:17px; }
.header-actions button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-left:8px; }
.container{ max-width:1200px; margin:24px auto; padding:0 16px; }
.stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:20px; }
.stat{ background:#fff; border-radius:10px; padding:16px; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.stat .label{ font-size:12px; color:#718096; }
.stat .value{ font-size:22px; font-weight:800; color:#2d3748; margin-top:4px; }
.card{ background:#fff; border-radius:10px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); overflow-x:auto; }
table{ width:100%; border-collapse:collapse; font-size:13px; min-width:700px; }
th,td{ padding:9px; text-align:left; border-bottom:1px solid #edf2f7; }
th{ background:#f8fafc; color:#4a5568; position:sticky; top:0; }
</style>
</head>
<body>
<div id="loadingScreen">Checking session...</div>
<div id="mainContent">
  <header>
    <h1>📍 Live Tracking — <span id="trackVesselName" style="font-weight:400; font-size:14px;">—</span></h1>
    <div class="header-actions">
      <button id="backBtn">↩ Main Menu</button>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>
  <div class="container">
    <div class="stat-grid">
      <div class="stat"><div class="label">Total Trucks</div><div class="value" id="totalCount">0</div></div>
      <div class="stat"><div class="label">Total Weight (t)</div><div class="value" id="totalWeight">0</div></div>
      <div class="stat"><div class="label">Total Bags</div><div class="value" id="totalBags">0</div></div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Delivery No.</th><th>Truck No.</th><th>Status</th><th>Bags</th><th>Net (MT)</th><th>Transporter</th><th>Time</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <p style="font-size:12px; color:#718096; margin-top:12px;">Note: all figures are based on weighbridge (PGI) operations — nothing is counted or deducted until PGI is confirmed.</p>
    </div>
  </div>
</div>
<script src="version.js"></script>
</body>
</html>
