<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stevedore</title>
<script type="module">
import { requireAuth, requireRole, signOut, auth, db, collection, query, orderBy, limit, getDocs, updateDoc, doc, serverTimestamp, logAudit }
  from "./firebase-config.js";

requireAuth((user, profile) => {
  if (!requireRole(profile, ["loading", "admin"])) return;
  const empName = sessionStorage.getItem("employeeName");
  if (empName) document.getElementById("operatorName").textContent = "Operator: " + empName;
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  loadBagWeight().then(loadTruckInList);
  loadHoldOptions();
});
document.getElementById("logoutBtn").addEventListener("click", async () => { if(confirm("Sign out?")){ await signOut(auth); window.location.href="index.html"; }});
document.getElementById("backBtn").addEventListener("click", () => window.location.href = "dashboard.html");
document.getElementById("refreshBtn").addEventListener("click", loadTruckInList);

let defaultBagWeight = 50;
async function loadBagWeight() {
  const snap = await getDocs(collection(db, "settings"));
  if (!snap.empty) defaultBagWeight = Number(snap.docs[0].data().bagWeight) || 50;
}

async function loadHoldOptions() {
  const sel = document.getElementById("holdSelect");
  const snap = await getDocs(collection(db, "holds"));
  sel.innerHTML = '<option value="">Select hold...</option>';
  const docs = [];
  snap.forEach(d => docs.push(d.data()));
  docs.sort((a, b) => String(a.holdNo).localeCompare(String(b.holdNo), undefined, { numeric: true }));
  docs.forEach(h => {
    const opt = document.createElement("option");
    opt.value = h.holdNo; opt.textContent = "Hold " + h.holdNo;
    sel.appendChild(opt);
  });
}

let selectedDocId = null, selectedData = null;

// Show ONLY deliveries whose status is "Truck In"
async function loadTruckInList() {
  const body = document.getElementById("listBody");
  body.innerHTML = "<tr><td colspan='4' style='padding:10px;'>Loading...</td></tr>";
  document.getElementById("resultBox").style.display = "none";
  selectedDocId = null;
  try {
    const q = query(collection(db, "deliveries"), orderBy("createdAt", "desc"), limit(100));
    const snap = await getDocs(q);
    const rows = [];
    snap.forEach(dd => { const r = dd.data(); if (r.status === "Truck In") rows.push({ id: dd.id, ...r }); });
    if (rows.length === 0) { body.innerHTML = "<tr><td colspan='4' style='padding:10px;color:#718096;'>No trucks waiting to be loaded.</td></tr>"; return; }
    body.innerHTML = "";
    rows.forEach(r => {
      const tr = document.createElement("tr");
      tr.style.cursor = "pointer";
      tr.innerHTML =
        `<td style="padding:10px;border-bottom:1px solid #edf2f7;">${r.deliveryNo || ""}</td>` +
        `<td style="padding:10px;border-bottom:1px solid #edf2f7;">${r.truckNumber || ""}</td>` +
        `<td style="padding:10px;border-bottom:1px solid #edf2f7;">${((Number(r.emptyWeight)||0)/1000).toFixed(3)}</td>` +
        `<td style="padding:10px;border-bottom:1px solid #edf2f7;color:#2c5282;font-weight:700;">Select ›</td>`;
      tr.addEventListener("click", () => selectTruck(r));
      body.appendChild(tr);
    });
  } catch (err) {
    console.error(err);
    body.innerHTML = "<tr><td colspan='4' style='padding:10px;color:#c53030;'>Could not load list.</td></tr>";
  }
}

function selectTruck(r) {
  selectedDocId = r.id;
  selectedData = r;
  document.getElementById("resDeliveryNo").textContent = r.deliveryNo || "";
  document.getElementById("resTruckNo").textContent = r.truckNumber || "";
  document.getElementById("resEmptyWeight").textContent = ((Number(r.emptyWeight)||0)/1000).toFixed(3);
  document.getElementById("bagsInput").value = "";
  document.getElementById("estWeight").textContent = "0.00";
  document.getElementById("holdSelect").value = "";
  const box = document.getElementById("resultBox");
  box.style.display = "block";
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

document.getElementById("bagsInput").addEventListener("input", () => {
  const bags = Number(document.getElementById("bagsInput").value) || 0;
  document.getElementById("estWeight").textContent = ((bags * defaultBagWeight)/1000).toFixed(3);
});

document.getElementById("confirmLoadingBtn").addEventListener("click", async () => {
  if (!selectedDocId) { alert("Please select a truck from the list first."); return; }
  const hold = document.getElementById("holdSelect").value;
  const bags = Number(document.getElementById("bagsInput").value);
  if (!hold) { alert("Please select the hold you loaded from."); return; }
  if (!bags || bags <= 0) { alert("Please enter number of bags."); return; }
  if (!confirm("Confirm Pick for this truck?")) return;

  const btn = document.getElementById("confirmLoadingBtn");
  btn.disabled = true; btn.textContent = "Saving...";
  try {
    await updateDoc(doc(db, "deliveries", selectedDocId), {
      numberOfBags: bags,
      hold: hold,
      status: "Loading Complete",
      reversedIndicator: false,   // cleared: truck moved forward again
      pickedBy: sessionStorage.getItem("employeeName") || "",
      pickedAt: serverTimestamp()
    });
    await logAudit({ deliveryNo: selectedData.deliveryNo, truckNumber: selectedData.truckNumber, action: "Pick", fromStatus: "Truck In", toStatus: "Loading Complete", byUser: sessionStorage.getItem("employeeName") || "", reason: "" });
    alert("✅ Pick confirmed. Truck is ready for PGI at the weighbridge.");
    loadTruckInList();
  } catch (err) {
    console.error(err);
    alert("Error: " + err.message);
  } finally {
    btn.disabled = false; btn.textContent = "✔ Pick";
  }
});
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
body { background:#f4f6f9; min-height:100vh; }
#loadingScreen { display:flex; align-items:center; justify-content:center; height:100vh; color:#718096; }
#mainContent { display:none; }
header { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header h1{ font-size:17px; }
.header-actions button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-left:8px; }
.container{ max-width:700px; margin:24px auto; padding:0 16px; }
.card{ background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
.card h2{ font-size:16px; color:#1e3a5f; margin-bottom:14px; }
.form-group{ flex:1; min-width:150px; }
.form-group label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
.form-group input{ width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
.result-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #edf2f7; font-size:14px; }
.result-row b{ color:#1e3a5f; }
#confirmLoadingBtn{ width:100%; padding:12px; background:#2c5282; color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; margin-top:10px; }
</style>
</head>
<body>
<div id="loadingScreen">Checking session...</div>
<div id="mainContent">
  <header>
    <h1>📦 Stevedore</h1>
    <div id="operatorName" style="font-size:12px; opacity:.85;"></div>
    <div class="header-actions">
      <button id="backBtn">↩ Main Menu</button>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>
  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="margin:0;">Trucks waiting to be loaded</h2>
        <button id="refreshBtn" style="padding:8px 14px; background:#2c5282; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:700; font-size:13px;">🔄 Refresh</button>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:13px; min-width:420px;">
          <thead><tr>
            <th style="text-align:left; padding:10px; background:#f8fafc; color:#4a5568;">DN</th>
            <th style="text-align:left; padding:10px; background:#f8fafc; color:#4a5568;">Truck</th>
            <th style="text-align:left; padding:10px; background:#f8fafc; color:#4a5568;">Empty (MT)</th>
            <th style="padding:10px; background:#f8fafc;"></th>
          </tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </div>

    <div class="card" id="resultBox" style="display:none;">
      <h2>Selected Truck</h2>
      <div class="result-row"><span>Delivery No.</span><b id="resDeliveryNo"></b></div>
      <div class="result-row"><span>Truck No.</span><b id="resTruckNo"></b></div>
      <div class="result-row"><span>Empty Weight (MT)</span><b id="resEmptyWeight"></b></div>
      <div class="form-group" style="margin-top:12px;">
        <label>Hold No. (loaded from)</label>
        <select id="holdSelect" style="width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px;"></select>
      </div>
      <div class="form-group" style="margin-top:12px;">
        <label>Number of Bags loaded</label>
        <input type="number" id="bagsInput">
      </div>
      <div class="result-row"><span>Estimated Weight (MT)</span><b id="estWeight">0.00</b></div>
      <button id="confirmLoadingBtn">✔ Pick</button>
      <p style="font-size:12px; color:#718096; margin-top:12px;">To fix a mistake, correct the bags/hold above and press Pick again.</p>
    </div>
  </div>
</div>
<script src="version.js"></script>
</body>
</html>
