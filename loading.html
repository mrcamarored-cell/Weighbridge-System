<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stevedore</title>
<script type="module">
import { requireAuth, requireRole, signOut, auth, db, collection, query, where, orderBy, limit, getDocs, updateDoc, doc, serverTimestamp }
  from "./firebase-config.js";

requireAuth((user, profile) => {
  if (!requireRole(profile, ["loading", "admin"])) return;
  const empName = sessionStorage.getItem("employeeName");
  if (empName) document.getElementById("operatorName").textContent = "Operator: " + empName;
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  loadBagWeight();
});
document.getElementById("logoutBtn").addEventListener("click", async () => { if(confirm("Sign out?")){ await signOut(auth); window.location.href="index.html"; }});
document.getElementById("backBtn").addEventListener("click", () => window.location.href = "dashboard.html");

let defaultBagWeight = 50;
async function loadBagWeight() {
  const snap = await getDocs(collection(db, "settings"));
  if (!snap.empty) defaultBagWeight = Number(snap.docs[0].data().bagWeight) || 50;
}

document.getElementById("searchForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const truckNumber = document.getElementById("truckNo").value.trim();
  if (!truckNumber) return;

  const q = query(
    collection(db, "deliveries"),
    where("truckNumber", "==", truckNumber),
    orderBy("createdAt", "desc"), limit(1)
  );
  const snap = await getDocs(q);
  const box = document.getElementById("resultBox");
  box.style.display = "none";

  if (snap.empty) {
    alert("Truck not found. Please check the truck number.");
    return;
  }

  const d = snap.docs[0];
  const data = d.data();

  if (data.status !== "Truck In") {
    alert("⚠️ This truck cannot be picked right now. Current status: " + data.status);
    return;
  }

  document.getElementById("resDeliveryNo").textContent = data.deliveryNo;
  document.getElementById("resTruckNo").textContent = data.truckNumber;
  document.getElementById("resEmptyWeight").textContent = data.emptyWeight;
  document.getElementById("bagsInput").value = "";
  document.getElementById("estWeight").textContent = "0.00";
  box.style.display = "block";
  box.dataset.docId = d.id;
});

document.getElementById("bagsInput").addEventListener("input", () => {
  const bags = Number(document.getElementById("bagsInput").value) || 0;
  document.getElementById("estWeight").textContent = (bags * defaultBagWeight).toFixed(2);
});

document.getElementById("confirmLoadingBtn").addEventListener("click", async () => {
  const box = document.getElementById("resultBox");
  const docId = box.dataset.docId;
  const bags = Number(document.getElementById("bagsInput").value);
  if (!bags) { alert("Please enter number of bags."); return; }
  if (!confirm("Confirm Pick for this truck?")) return;

  await updateDoc(doc(db, "deliveries", docId), {
    numberOfBags: bags,
    status: "Loading Complete",
    pickedBy: sessionStorage.getItem("employeeName") || "",
    pickedAt: serverTimestamp()
  });

  alert("✅ Pick confirmed. Truck is ready for PGI at the weighbridge.");
  box.style.display = "none";
  document.getElementById("searchForm").reset();
});
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
body { background:#f4f6f9; min-height:100vh; }
#loadingScreen { display:flex; align-items:center; justify-content:center; height:100vh; color:#718096; }
#mainContent { display:none; }
header { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header h1{ font-size:17px; }
.header-actions button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-left:8px; }
.container{ max-width:700px; margin:24px auto; padding:0 16px; }
.card{ background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
.card h2{ font-size:16px; color:#1e3a5f; margin-bottom:14px; }
.form-row{ display:flex; gap:12px; align-items:end; flex-wrap:wrap; }
.form-group{ flex:1; min-width:150px; }
.form-group label{ display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
.form-group input{ width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
.form-row button{ padding:10px 20px; background:#2c5282; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:700; }
.result-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #edf2f7; font-size:14px; }
.result-row b{ color:#1e3a5f; }
#confirmLoadingBtn{ width:100%; padding:12px; background:#2c5282; color:#fff; border:none; border-radius:8px; font-weight:700; cursor:pointer; margin-top:10px; }
</style>
</head>
<body>
<div id="loadingScreen">Checking session...</div>
<div id="mainContent">
  <header>
    <h1>📦 Stevedore</h1>
    <div id="operatorName" style="font-size:12px; opacity:.85;"></div>
    <div class="header-actions">
      <button id="backBtn">↩ Main Menu</button>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>
  <div class="container">
    <div class="card">
      <h2>Search by Truck Number</h2>
      <form id="searchForm" class="form-row">
        <div class="form-group"><label>Truck No.</label><input type="text" id="truckNo" required></div>
        <button type="submit">🔍 Search</button>
      </form>
    </div>

    <div class="card" id="resultBox" style="display:none;">
      <h2>Delivery Details</h2>
      <div class="result-row"><span>Delivery No.</span><b id="resDeliveryNo"></b></div>
      <div class="result-row"><span>Truck No.</span><b id="resTruckNo"></b></div>
      <div class="result-row"><span>Empty Weight (kg)</span><b id="resEmptyWeight"></b></div>
      <div class="form-group" style="margin-top:12px;">
        <label>Number of Bags</label>
        <input type="number" id="bagsInput">
      </div>
      <div class="result-row"><span>Estimated Weight (kg)</span><b id="estWeight">0.00</b></div>
      <button id="confirmLoadingBtn">✔ Pick</button>
    </div>
  </div>
</div>
<script src="version.js"></script>
</body>
</html>
