<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المستخدمين</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8vEIq7vPDE3EXdZLBPr3gjygZN9MpQgs",
  authDomain: "weighbridge-system-ee0b0.firebaseapp.com",
  projectId: "weighbridge-system-ee0b0",
  storageBucket: "weighbridge-system-ee0b0.firebasestorage.app",
  messagingSenderId: "1087988339377",
  appId: "1:1087988339377:web:3fedc03a481e786b384890"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "index.html"; return; }

  // تحقق أن المستخدم أدمن
  const userDoc = await getDoc(doc(db, "users", user.uid));
  const role = userDoc.exists() ? userDoc.data().role : "user";
  if (role !== "admin") {
    alert("هذه الصفحة للمسؤولين فقط.");
    window.location.href = "dashboard.html";
    return;
  }

  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  loadUsers();
});
document.getElementById("logoutBtn").addEventListener("click", async () => { if(confirm("تسجيل الخروج؟")){ await signOut(auth); window.location.href="index.html"; }});
document.getElementById("backBtn").addEventListener("click", () => window.location.href = "dashboard.html");

async function loadUsers() {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "<tr><td colspan='4'>جاري التحميل...</td></tr>";
  const snap = await getDocs(collection(db, "users"));
  if (snap.empty) { tbody.innerHTML = "<tr><td colspan='4'>لا يوجد مستخدمون</td></tr>"; return; }
  tbody.innerHTML = "";
  snap.forEach(d => {
    const u = d.data();
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.name || "—"}</td>
      <td>${u.email || "—"}</td>
      <td>${u.role === "admin" ? "مسؤول" : "مستخدم"}</td>
      <td><button class="delBtn" data-id="${d.id}">🗑 حذف</button></td>
    `;
    tbody.appendChild(tr);
  });
  document.querySelectorAll(".delBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (confirm("حذف بيانات هذا المستخدم من القائمة؟ (لن يحذف حساب الدخول تلقائياً)")) {
        await deleteDoc(doc(db, "users", btn.dataset.id));
        loadUsers();
      }
    });
  });
}

document.getElementById("userForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;

  if (!name || !email || !password || !role) { alert("الرجاء تعبئة جميع الحقول"); return; }
  if (password.length < 6) { alert("كلمة المرور يجب ألا تقل عن 6 أحرف"); return; }

  try {
    // إنشاء حساب دخول جديد (ملاحظة: هذا سيسجل دخول كمستخدم جديد مؤقتاً في بعض إعدادات Firebase)
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, "users", cred.user.uid), { name, email, role, password });
    alert("✅ تم إنشاء المستخدم بنجاح.");
    document.getElementById("userForm").reset();
    loadUsers();
  } catch (err) {
    alert("خطأ: " + err.message);
  }
});
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
body { background:#f4f6f9; min-height:100vh; }
#loadingScreen { display:flex; align-items:center; justify-content:center; height:100vh; color:#718096; }
#mainContent { display:none; }
header { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header h1{ font-size:17px; }
.header-actions button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-right:8px; }
.container{ max-width:800px; margin:24px auto; padding:0 16px; }
.card{ background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
.card h2{ font-size:16px; color:#1e3a5f; margin-bottom:14px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
.grid input, .grid select{ padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
#userForm button{ margin-top:14px; padding:10px 20px; background:#2c5282; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:700; }
table{ width:100%; border-collapse:collapse; font-size:14px; }
th,td{ padding:10px; text-align:right; border-bottom:1px solid #edf2f7; }
th{ background:#f8fafc; color:#4a5568; }
.delBtn{ background:#fed7d7; color:#822727; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
.note{ font-size:12px; color:#a0aec0; margin-top:8px; }
</style>
</head>
<body>
<div id="loadingScreen">جاري التحقق من الجلسة...</div>
<div id="mainContent">
  <header>
    <h1>👤 إدارة المستخدمين</h1>
    <div class="header-actions">
      <button id="backBtn">↩ القائمة الرئيسية</button>
      <button id="logoutBtn">تسجيل الخروج</button>
    </div>
  </header>
  <div class="container">
    <div class="card">
      <h2>إضافة مستخدم جديد</h2>
      <form id="userForm">
        <div class="grid">
          <input type="text" id="name" placeholder="الاسم الكامل" required>
          <input type="email" id="email" placeholder="البريد الإلكتروني" required>
          <input type="password" id="password" placeholder="كلمة المرور" required>
          <select id="role" required>
            <option value="">الدور...</option>
            <option value="user">مستخدم</option>
            <option value="admin">مسؤول</option>
          </select>
        </div>
        <button type="submit">➕ إنشاء مستخدم</button>
        <div class="note">ملاحظة: إنشاء مستخدم هنا سيُنشئ له حساب دخول فعلي على Firebase.</div>
      </form>
    </div>
    <div class="card">
      <h2>قائمة المستخدمين</h2>
      <table>
        <thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>الدور</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
