<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management</title>
<script type="module">
import {
  requireAuth, requireRole, signOut, auth, db, createUserKeepingSession,
  collection, getDocs, deleteDoc, doc, getDoc, setDoc, updateDoc
} from "./firebase-config.js";

requireAuth((user, profile) => {
  if (!requireRole(profile, ["admin"])) return;
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  loadUsers();
});
document.getElementById("logoutBtn").addEventListener("click", async () => { if(confirm("Sign out?")){ await signOut(auth); window.location.href="index.html"; }});
document.getElementById("backBtn").addEventListener("click", () => window.location.href = "dashboard.html");

const roleLabels = {
  weighbridge:"Weighbridge", loading:"Stevedore", warehouse:"Warehouse",
  supervisor:"Supervisor", viewer:"Viewer", admin:"Admin"
};

async function loadUsers() {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "<tr><td colspan='5'>Loading...</td></tr>";
  const snap = await getDocs(collection(db, "users"));
  if (snap.empty) { tbody.innerHTML = "<tr><td colspan='5'>No users</td></tr>"; return; }
  tbody.innerHTML = "";

  const now = Date.now();
  snap.forEach(d => {
    const u = d.data();
    const lastActiveMs = u.lastActive ? u.lastActive.toDate().getTime() : 0;
    const isOnline = (now - lastActiveMs) < 3 * 60 * 1000; // active within last 3 minutes

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${u.name || "—"}</td>
      <td>${u.username || "—"}</td>
      <td>${roleLabels[u.role] || u.role}</td>
      <td>${isOnline ? "🟢 Online" : "⚪ Offline"}</td>
      <td>
        <button class="editBtn" data-id="${d.id}">✏️ Edit</button>
        <button class="forceBtn" data-id="${d.id}" ${isOnline ? "" : "disabled"}>🚪 Force Logout</button>
      </td>
      <td><button class="delBtn" data-id="${d.id}">🗑 Delete</button></td>
    `;
    tbody.appendChild(tr);
  });

  document.querySelectorAll(".delBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (confirm("Remove this user's profile? (Their login account must still be deleted manually in Firebase Console)")) {
        await deleteDoc(doc(db, "users", btn.dataset.id));
        loadUsers();
      }
    });
  });

  document.querySelectorAll(".forceBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (confirm("Force this user to sign out now?")) {
        await updateDoc(doc(db, "users", btn.dataset.id), { forceLogout: true });
        alert("They will be signed out within 20 seconds.");
      }
    });
  });

  document.querySelectorAll(".editBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const snap2 = await getDoc(doc(db, "users", btn.dataset.id));
      if (!snap2.exists()) return;
      const u = snap2.data();
      document.getElementById("editDocId").value = btn.dataset.id;
      document.getElementById("editName").value = u.name || "";
      document.getElementById("editRole").value = u.role || "";
      document.getElementById("editModal").style.display = "flex";
    });
  });
}

document.getElementById("editForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const docId = document.getElementById("editDocId").value;
  const name = document.getElementById("editName").value.trim();
  const role = document.getElementById("editRole").value;

  await updateDoc(doc(db, "users", docId), { name, role });
  document.getElementById("editModal").style.display = "none";
  loadUsers();
});
document.getElementById("cancelEditBtn").addEventListener("click", () => {
  document.getElementById("editModal").style.display = "none";
});

document.getElementById("userForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("name").value.trim();
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const role = document.getElementById("role").value;
  if (!name || !username || !password || !role) { alert("Please fill in all required fields"); return; }
  if (password.length < 6) { alert("Password must be at least 6 characters"); return; }

  const email = username.toLowerCase().replace(/\s+/g, "") + "@logistics.local";

  try {
    const uid = await createUserKeepingSession(email, password);
    await setDoc(doc(db, "users", uid), {
      name, username, email, role, password, online: false
    });
    alert("✅ User created. Username: " + username);
    document.getElementById("userForm").reset();
    loadUsers();
  } catch (err) {
    alert("Error: " + err.message);
  }
});
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
body { background:#f4f6f9; min-height:100vh; }
#loadingScreen { display:flex; align-items:center; justify-content:center; height:100vh; color:#718096; }
#mainContent { display:none; }
header { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header h1{ font-size:17px; }
.header-actions button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-left:8px; }
.container{ max-width:900px; margin:24px auto; padding:0 16px; }
.card{ background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
.card h2{ font-size:16px; color:#1e3a5f; margin-bottom:14px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
.grid input, .grid select{ padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
#userForm button{ margin-top:14px; padding:10px 20px; background:#2c5282; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:700; }
.note{ font-size:12px; color:#a0aec0; margin-top:8px; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th,td{ padding:9px; text-align:left; border-bottom:1px solid #edf2f7; }
th{ background:#f8fafc; color:#4a5568; }
.delBtn{ background:#fed7d7; color:#822727; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
.editBtn{ background:#bee3f8; color:#2a4365; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px; margin-left:4px; }
.forceBtn{ background:#feebc8; color:#7b341e; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px; margin-left:4px; }
.forceBtn:disabled{ opacity:.4; cursor:not-allowed; }
#editModal{ display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); align-items:center; justify-content:center; z-index:1000; }
#editModal .modal-box{ background:#fff; border-radius:10px; padding:24px; width:100%; max-width:400px; }
#editModal h2{ font-size:16px; color:#1e3a5f; margin-bottom:14px; }
#editModal label{ display:block; font-size:13px; font-weight:600; margin:10px 0 4px; }
#editModal input, #editModal select{ width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
#editModal .modal-actions{ display:flex; gap:10px; margin-top:16px; }
#editModal .modal-actions button{ flex:1; padding:10px; border:none; border-radius:7px; cursor:pointer; font-weight:700; }
#editModal .save-btn{ background:#2c5282; color:#fff; }
#editModal .cancel-btn{ background:#e2e8f0; color:#4a5568; }
</style>
</head>
<body>
<div id="loadingScreen">Checking session...</div>
<div id="mainContent">
  <header>
    <h1>👤 User Management</h1>
    <div class="header-actions">
      <button id="backBtn">↩ Main Menu</button>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>
  <div class="container">
    <div class="card">
      <h2>Add New User</h2>
      <form id="userForm">
        <div class="grid">
          <input type="text" id="name" placeholder="Full Name" required>
          <input type="text" id="username" placeholder="Username" required>
          <input type="password" id="password" placeholder="Password" required>
          <select id="role" required>
            <option value="">Role...</option>
            <option value="weighbridge">Weighbridge</option>
            <option value="loading">Stevedore</option>
            <option value="warehouse">Warehouse</option>
            <option value="supervisor">Supervisor</option>
            <option value="viewer">Viewer</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit">➕ Create User</button>
        <div class="note">Note: for Weighbridge/Stevedore/Warehouse, this creates a shared department login. Each employee enters their own Employee ID at sign-in — add employees under Settings.</div>
      </form>
    </div>
    <div class="card">
      <h2>Users & Online Status</h2>
      <table>
        <thead><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div id="editModal">
  <div class="modal-box">
    <h2>✏️ Edit User</h2>
    <form id="editForm">
      <input type="hidden" id="editDocId">
      <label>Full Name</label>
      <input type="text" id="editName" required>
      <label>Role</label>
      <select id="editRole" required>
        <option value="weighbridge">Weighbridge</option>
        <option value="loading">Stevedore</option>
        <option value="warehouse">Warehouse</option>
        <option value="supervisor">Supervisor</option>
        <option value="viewer">Viewer</option>
        <option value="admin">Admin</option>
      </select>
      <div class="modal-actions">
        <button type="button" id="cancelEditBtn" class="cancel-btn">Cancel</button>
        <button type="submit" class="save-btn">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script src="version.js"></script>
</body>
</html>
