<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skip / Container Weights</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8vEIq7vPDE3EXdZLBPr3gjygZN9MpQgs",
  authDomain: "weighbridge-system-ee0b0.firebaseapp.com",
  projectId: "weighbridge-system-ee0b0",
  storageBucket: "weighbridge-system-ee0b0.firebasestorage.app",
  messagingSenderId: "1087988339377",
  appId: "1:1087988339377:web:3fedc03a481e786b384890"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = "index.html"; return; }
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  loadSkips();
});
document.getElementById("logoutBtn").addEventListener("click", async () => { if(confirm("Sign out?")){ await signOut(auth); window.location.href="index.html"; }});
document.getElementById("backBtn").addEventListener("click", () => window.location.href = "dashboard.html");

const tbody = document.getElementById("tbody");

async function loadSkips() {
  tbody.innerHTML = "<tr><td colspan='3'>Loading...</td></tr>";
  const q = query(collection(db, "skipWeights"), orderBy("skipNumber"));
  const snap = await getDocs(q);
  if (snap.empty) { tbody.innerHTML = "<tr><td colspan='3'>No data</td></tr>"; return; }
  tbody.innerHTML = "";
  snap.forEach(d => {
    const data = d.data();
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${data.skipNumber}</td>
      <td>${data.emptyWeight} kg</td>
      <td><button class="delBtn" data-id="${d.id}">🗑 Delete</button></td>
    `;
    tbody.appendChild(tr);
  });
  document.querySelectorAll(".delBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (confirm("Delete this skip?")) {
        await deleteDoc(doc(db, "skipWeights", btn.dataset.id));
        loadSkips();
      }
    });
  });
}

document.getElementById("skipForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const skipNumber = document.getElementById("skipNumber").value.trim();
  const emptyWeight = Number(document.getElementById("emptyWeight").value);
  if (!skipNumber || !emptyWeight) { alert("Please fill in all fields"); return; }
  await addDoc(collection(db, "skipWeights"), { skipNumber, emptyWeight });
  document.getElementById("skipForm").reset();
  loadSkips();
});
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
body { background:#f4f6f9; min-height:100vh; }
#loadingScreen { display:flex; align-items:center; justify-content:center; height:100vh; color:#718096; }
#mainContent { display:none; }
header { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header h1{ font-size:17px; }
.header-actions button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-left:8px; }
.container{ max-width:800px; margin:24px auto; padding:0 16px; }
.card{ background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
.card h2{ font-size:16px; color:#1e3a5f; margin-bottom:14px; }
.form-row{ display:flex; gap:12px; flex-wrap:wrap; }
.form-row input{ flex:1; min-width:150px; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
.form-row button{ padding:10px 20px; background:#2c5282; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:700; }
table{ width:100%; border-collapse:collapse; }
th,td{ padding:10px; text-align:left; border-bottom:1px solid #edf2f7; font-size:14px; }
th{ background:#f8fafc; color:#4a5568; }
.delBtn{ background:#fed7d7; color:#822727; border:none; padding:5px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
</style>
</head>
<body>
<div id="loadingScreen">Checking session...</div>
<div id="mainContent">
  <header>
    <h1>📦 Skip / Container Weights</h1>
    <div class="header-actions">
      <button id="backBtn">↩ Main Menu</button>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>
  <div class="container">
    <div class="card">
      <h2>Add New Skip</h2>
      <form id="skipForm" class="form-row">
        <input type="text" id="skipNumber" placeholder="Skip Number" required>
        <input type="number" id="emptyWeight" placeholder="Empty Weight (kg)" required>
        <button type="submit">➕ Add</button>
      </form>
    </div>
    <div class="card">
      <h2>Skip List</h2>
      <table>
        <thead><tr><th>Skip Number</th><th>Empty Weight</th><th></th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
