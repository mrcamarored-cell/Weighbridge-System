<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<script type="module">
import {
  requireAuth, requireRole, signOut, auth, db,
  collection, addDoc, getDocs, deleteDoc, doc, setDoc
} from "./firebase-config.js";

let settingsDocId = null;

requireAuth((user, profile) => {
  if (!requireRole(profile, ["admin"])) return;
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  loadSettings();
  loadTransporters();
  loadVessels();
});
document.getElementById("logoutBtn").addEventListener("click", async () => { if(confirm("Sign out?")){ await signOut(auth); window.location.href="index.html"; }});
document.getElementById("backBtn").addEventListener("click", () => window.location.href = "dashboard.html");

// ===== General settings (bag weight, targets) =====
async function loadSettings() {
  const snap = await getDocs(collection(db, "settings"));
  if (!snap.empty) {
    settingsDocId = snap.docs[0].id;
    const s = snap.docs[0].data();
    document.getElementById("bagWeight").value = s.bagWeight || "";
    document.getElementById("targetWeight").value = s.targetWeight || "";
    document.getElementById("targetBags").value = s.targetBags || "";
  }
}

document.getElementById("settingsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const bagWeight = Number(document.getElementById("bagWeight").value) || 0;
  const targetWeight = Number(document.getElementById("targetWeight").value) || 0;
  const targetBags = Number(document.getElementById("targetBags").value) || 0;

  const id = settingsDocId || "main";
  await setDoc(doc(db, "settings", id), { bagWeight, targetWeight, targetBags });
  settingsDocId = id;
  alert("✅ Settings saved.");
});

// ===== Transporters =====
async function loadTransporters() {
  const tbody = document.getElementById("transporterTbody");
  const snap = await getDocs(collection(db, "transporters"));
  tbody.innerHTML = "";
  if (snap.empty) { tbody.innerHTML = "<tr><td colspan='2'>No transporters</td></tr>"; return; }
  snap.forEach(d => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${d.data().name}</td><td><button class="delT" data-id="${d.id}">🗑</button></td>`;
    tbody.appendChild(tr);
  });
  document.querySelectorAll(".delT").forEach(btn => btn.addEventListener("click", async () => {
    if (confirm("Delete this transporter?")) { await deleteDoc(doc(db, "transporters", btn.dataset.id)); loadTransporters(); }
  }));
}
document.getElementById("transporterForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("transporterName").value.trim();
  if (!name) return;
  await addDoc(collection(db, "transporters"), { name });
  document.getElementById("transporterForm").reset();
  loadTransporters();
});

// ===== Vessels =====
async function loadVessels() {
  const tbody = document.getElementById("vesselTbody");
  const snap = await getDocs(collection(db, "vessels"));
  tbody.innerHTML = "";
  if (snap.empty) { tbody.innerHTML = "<tr><td colspan='2'>No vessels</td></tr>"; return; }
  snap.forEach(d => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${d.data().name}</td><td><button class="delV" data-id="${d.id}">🗑</button></td>`;
    tbody.appendChild(tr);
  });
  document.querySelectorAll(".delV").forEach(btn => btn.addEventListener("click", async () => {
    if (confirm("Delete this vessel?")) { await deleteDoc(doc(db, "vessels", btn.dataset.id)); loadVessels(); }
  }));
}
document.getElementById("vesselForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("vesselName").value.trim();
  if (!name) return;
  await addDoc(collection(db, "vessels"), { name });
  document.getElementById("vesselForm").reset();
  loadVessels();
});

// ===== Employees (Employee ID -> Name) =====
const deptLabels = { weighbridge:"Weighbridge", loading:"Stevedore", warehouse:"Warehouse" };
async function loadEmployees() {
  const tbody = document.getElementById("employeeTbody");
  const snap = await getDocs(collection(db, "employees"));
  tbody.innerHTML = "";
  if (snap.empty) { tbody.innerHTML = "<tr><td colspan='3'>No employees</td></tr>"; return; }
  snap.forEach(d => {
    const e = d.data();
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${e.employeeId}</td><td>${e.name}</td><td>${deptLabels[e.department] || e.department || "—"}</td><td><button class="delE" data-id="${d.id}">🗑</button></td>`;
    tbody.appendChild(tr);
  });
  document.querySelectorAll(".delE").forEach(btn => btn.addEventListener("click", async () => {
    if (confirm("Delete this employee?")) { await deleteDoc(doc(db, "employees", btn.dataset.id)); loadEmployees(); }
  }));
}
document.getElementById("employeeForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const employeeId = document.getElementById("employeeIdInput").value.trim();
  const name = document.getElementById("employeeNameInput").value.trim();
  const department = document.getElementById("employeeDeptInput").value;
  if (!employeeId || !name || !department) { alert("Please fill in ID, Name and Department."); return; }
  await addDoc(collection(db, "employees"), { employeeId, name, department });
  document.getElementById("employeeForm").reset();
  loadEmployees();
});
loadEmployees();
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
body { background:#f4f6f9; min-height:100vh; }
#loadingScreen { display:flex; align-items:center; justify-content:center; height:100vh; color:#718096; }
#mainContent { display:none; }
header { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header h1{ font-size:17px; }
.header-actions button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-left:8px; }
.container{ max-width:800px; margin:24px auto; padding:0 16px; }
.card{ background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
.card h2{ font-size:16px; color:#1e3a5f; margin-bottom:14px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; }
.grid label{ font-size:12px; color:#4a5568; display:block; margin-bottom:4px; }
.grid input{ width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
.card button[type=submit]{ margin-top:14px; padding:10px 20px; background:#2c5282; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:700; }
.form-row{ display:flex; gap:10px; }
.form-row input{ flex:1; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
.form-row button{ padding:10px 16px; background:#2c5282; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:700; }
table{ width:100%; border-collapse:collapse; margin-top:12px; font-size:14px; }
th,td{ padding:8px; text-align:left; border-bottom:1px solid #edf2f7; }
.delT, .delV{ background:#fed7d7; color:#822727; border:none; padding:4px 8px; border-radius:6px; cursor:pointer; font-size:12px; }
</style>
</head>
<body>
<div id="loadingScreen">Checking session...</div>
<div id="mainContent">
  <header>
    <h1>⚙️ Settings</h1>
    <div class="header-actions">
      <button id="backBtn">↩ Main Menu</button>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>
  <div class="container">
    <div class="card">
      <h2>General Settings</h2>
      <form id="settingsForm">
        <div class="grid">
          <div><label>Default Bag Weight (kg)</label><input type="number" id="bagWeight" required></div>
          <div><label>Target Weight (kg)</label><input type="number" id="targetWeight" required></div>
          <div><label>Target Bags</label><input type="number" id="targetBags" required></div>
        </div>
        <button type="submit">💾 Save Settings</button>
      </form>
    </div>

    <div class="card">
      <h2>Transporters</h2>
      <form id="transporterForm" class="form-row">
        <input type="text" id="transporterName" placeholder="Transporter name" required>
        <button type="submit">➕ Add</button>
      </form>
      <table><tbody id="transporterTbody"></tbody></table>
    </div>

    <div class="card">
      <h2>Vessels</h2>
      <form id="vesselForm" class="form-row">
        <input type="text" id="vesselName" placeholder="Vessel name" required>
        <button type="submit">➕ Add</button>
      </form>
      <table><tbody id="vesselTbody"></tbody></table>
    </div>
    <div class="card">
      <h2>Employees (ID → Name)</h2>
      <form id="employeeForm" class="form-row">
        <input type="text" id="employeeIdInput" placeholder="Employee ID" required>
        <input type="text" id="employeeNameInput" placeholder="Employee Name" required>
        <select id="employeeDeptInput" required>
          <option value="">Department...</option>
          <option value="weighbridge">Weighbridge</option>
          <option value="loading">Stevedore</option>
          <option value="warehouse">Warehouse</option>
        </select>
        <button type="submit">➕ Add</button>
      </form>
      <table><tbody id="employeeTbody"></tbody></table>
    </div>
  </div>
</div>
<script src="version.js"></script>
</body>
</html>
