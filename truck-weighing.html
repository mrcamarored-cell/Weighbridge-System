<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck In / Out - Weighbridge</title>
<script type="module">
import {
  requireAuth, requireRole, signOut, auth, db,
  collection, doc, getDoc, getDocs, addDoc, updateDoc, query, where, orderBy, limit,
  serverTimestamp, generateDeliveryNo
} from "./firebase-config.js";

let currentUser, currentProfile;

requireAuth((user, profile) => {
  if (!requireRole(profile, ["weighbridge", "admin"])) return;
  currentUser = user; currentProfile = profile;
  const empName = sessionStorage.getItem("employeeName");
  if (empName) document.getElementById("operatorName").textContent = "Operator: " + empName;
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
});

document.getElementById("logoutBtn").addEventListener("click", async () => { if(confirm("Sign out?")){ await signOut(auth); window.location.href="index.html"; }});
document.getElementById("backBtn").addEventListener("click", () => window.location.href = "dashboard.html");

// ===== Tabs =====
const tabIn = document.getElementById("tabIn");
const tabOut = document.getElementById("tabOut");
const panelIn = document.getElementById("panelIn");
const panelOut = document.getElementById("panelOut");
tabIn.addEventListener("click", () => switchTab("in"));
tabOut.addEventListener("click", () => switchTab("out"));
function switchTab(which) {
  tabIn.classList.toggle("active", which === "in");
  tabOut.classList.toggle("active", which === "out");
  panelIn.style.display = which === "in" ? "block" : "none";
  panelOut.style.display = which === "out" ? "block" : "none";
}

// ================= TRUCK IN =================
const truckInNo = document.getElementById("truckInNo");
const truckStatusMsg = document.getElementById("truckStatusMsg");
const emptyWeightIn = document.getElementById("emptyWeightIn");
const emptyWeightUnitLabel = document.getElementById("emptyWeightUnitLabel");
const confirmEmptyGroup = document.getElementById("confirmEmptyGroup");
const confirmEmptyChk = document.getElementById("confirmEmptyChk");
const correctEmptyBtn = document.getElementById("correctEmptyBtn");
const methodSel = document.getElementById("weighingMethod");
const dnDisplay = document.getElementById("dnDisplay");
const transporterField = document.getElementById("transporterField");
const vesselField = document.getElementById("vesselField");
const unitMtBtn = document.getElementById("unitMt");
const unitKgBtn = document.getElementById("unitKg");
const saveInBtn = document.getElementById("saveInBtn");

let truckFound = false;
let truckDocId = null;
let emptyKg = null;          // canonical empty weight in KG
let emptyKgOriginal = null;  // to detect correction of an existing truck
let unit = "MT";
let currentTransporter = "";
let currentVessel = "";

// ---- Load current shipment (transporter + vessel) set by admin ----
async function loadCurrentShipment() {
  const snap = await getDocs(collection(db, "settings"));
  if (!snap.empty) {
    const s = snap.docs[0].data();
    currentTransporter = s.currentTransporter || "";
    currentVessel = s.currentVessel || "";
  }
  transporterField.value = currentTransporter || "(not set by admin)";
  vesselField.value = currentVessel || "(not set by admin)";
  if (!currentTransporter || !currentVessel) {
    truckStatusMsg.textContent = "⚠️ Admin has not set the current Transporter/Vessel in Settings. Truck In is disabled until then.";
    truckStatusMsg.style.color = "#c53030";
    saveInBtn.disabled = true;
  }
}
loadCurrentShipment();

// ---- Unit toggle (MT default, KG option) ----
function setUnit(u) {
  unit = u;
  unitMtBtn.classList.toggle("active", u === "MT");
  unitKgBtn.classList.toggle("active", u === "KG");
  emptyWeightUnitLabel.textContent = u;
  renderEmptyInput();
}
unitMtBtn.addEventListener("click", () => setUnit("MT"));
unitKgBtn.addEventListener("click", () => setUnit("KG"));

// render the canonical KG value into the input using the selected unit
function renderEmptyInput() {
  if (emptyKg === null || isNaN(emptyKg)) { emptyWeightIn.value = ""; return; }
  emptyWeightIn.value = unit === "MT" ? (emptyKg / 1000) : emptyKg;
}

// when the user types, convert the entered value (in selected unit) back to KG
emptyWeightIn.addEventListener("input", () => {
  const v = parseFloat(emptyWeightIn.value);
  emptyKg = isNaN(v) ? null : (unit === "MT" ? v * 1000 : v);
});

// ---- Truck lookup: new vs existing ----
truckInNo.addEventListener("blur", async () => {
  const val = truckInNo.value.trim();
  if (!val) return;
  const q = query(collection(db, "trucks"), where("truckNumber", "==", val));
  const snap = await getDocs(q);
  confirmEmptyChk.checked = false;
  if (!snap.empty) {
    truckFound = true;
    truckDocId = snap.docs[0].id;
    emptyKg = Number(snap.docs[0].data().emptyWeightKg) || 0;
    emptyKgOriginal = emptyKg;
    emptyWeightIn.disabled = true;
    correctEmptyBtn.style.display = "inline-block";
    confirmEmptyGroup.style.display = "block";
    truckStatusMsg.textContent = "✔ Existing truck found. Please verify the empty weight is correct.";
    truckStatusMsg.style.color = "#2b6cb0";
  } else {
    truckFound = false;
    truckDocId = null;
    emptyKg = null;
    emptyKgOriginal = null;
    emptyWeightIn.disabled = false;
    correctEmptyBtn.style.display = "none";
    confirmEmptyGroup.style.display = "none";
    truckStatusMsg.textContent = "🆕 New truck. Please enter its empty weight.";
    truckStatusMsg.style.color = "#2f855a";
  }
  renderEmptyInput();
});

// ---- Allow correcting an existing truck's empty weight ----
correctEmptyBtn.addEventListener("click", () => {
  emptyWeightIn.disabled = false;
  emptyWeightIn.focus();
  truckStatusMsg.textContent = "✏️ Correcting empty weight. This updates the truck for FUTURE records only; past records stay unchanged.";
  truckStatusMsg.style.color = "#b7791f";
});

// ---- Save Truck In ----
document.getElementById("truckInForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const truckNumber = truckInNo.value.trim();
  const method = methodSel.value;

  if (!truckNumber) { alert("Please enter the truck number."); return; }
  if (emptyKg === null || emptyKg <= 0) { alert("Please enter a valid empty weight."); return; }
  if (!method) { alert("Please select a weighing method."); return; }
  if (!currentTransporter || !currentVessel) { alert("Admin must set the current Transporter and Vessel in Settings first."); return; }
  if (truckFound && !confirmEmptyChk.checked) { alert("Please confirm the empty weight is correct (or correct it) before saving."); return; }

  saveInBtn.disabled = true; saveInBtn.textContent = "Saving...";
  try {
    if (!truckFound) {
      // create the new truck master record
      const ref = await addDoc(collection(db, "trucks"), { truckNumber, emptyWeightKg: emptyKg });
      truckDocId = ref.id;
    } else if (emptyKg !== emptyKgOriginal) {
      // correction: update master for FUTURE deliveries; past deliveries keep their own snapshot
      await updateDoc(doc(db, "trucks", truckDocId), { emptyWeightKg: emptyKg });
    }

    const deliveryNo = await generateDeliveryNo();

    await addDoc(collection(db, "deliveries"), {
      deliveryNo, truckNumber,
      emptyWeight: emptyKg,          // snapshot in KG (canonical)
      weighingMethod: method,
      transporter: currentTransporter,
      vessel: currentVessel,
      numberOfBags: null,
      grossWeight: null,
      netWeight: null,
      status: "Truck In",
      truckInBy: sessionStorage.getItem("employeeName") || currentProfile.name || currentUser.email,
      truckInAt: serverTimestamp(),
      createdAt: serverTimestamp()
    });

    dnDisplay.value = deliveryNo;
    alert("✅ Truck In saved. Delivery No: " + deliveryNo);

    // reset for the next truck (keep unit + transporter/vessel)
    truckInNo.value = "";
    methodSel.value = "";
    emptyKg = null; emptyKgOriginal = null; truckFound = false; truckDocId = null;
    emptyWeightIn.disabled = false; emptyWeightIn.value = "";
    confirmEmptyGroup.style.display = "none";
    confirmEmptyChk.checked = false;
    correctEmptyBtn.style.display = "none";
    truckStatusMsg.textContent = "";
    setTimeout(() => { dnDisplay.value = ""; }, 4000);
  } catch (err) {
    console.error(err);
    alert("Error: " + err.message);
  } finally {
    saveInBtn.disabled = false; saveInBtn.textContent = "💾 Save Truck In";
  }
});

// ================= PGI (weigh loaded truck) =================
let pgiDocId = null, pgiEmptyWeight = 0;

document.getElementById("searchOutForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const val = document.getElementById("searchOutInput").value.trim();
  if (!val) return;

  const q = query(
    collection(db, "deliveries"),
    where("truckNumber", "==", val),
    orderBy("createdAt", "desc"),
    limit(1)
  );
  const snap = await getDocs(q);
  const resultBox = document.getElementById("outResultBox");
  resultBox.style.display = "none";

  if (snap.empty) { alert("Truck not found. Please check the truck number."); return; }

  const docSnap = snap.docs[0];
  const data = docSnap.data();

  if (data.status === "Truck In") {
    alert("⚠️ This truck is still waiting to be loaded (Stevedore has not picked it yet).");
    return;
  }
  if (data.status !== "Loading Complete") {
    alert("⚠️ This truck cannot do PGI right now. Current status: " + data.status);
    return;
  }

  pgiDocId = docSnap.id;
  pgiEmptyWeight = Number(data.emptyWeight) || 0;

  document.getElementById("outDeliveryNo").textContent = data.deliveryNo;
  document.getElementById("outTruckNo").textContent = data.truckNumber;
  document.getElementById("outBags").value = data.numberOfBags || "";
  document.getElementById("outGross").value = "";
  document.getElementById("outNetPreview").textContent = "0.00";
  resultBox.style.display = "block";
});

document.getElementById("outGross").addEventListener("input", updatePgiNet);
document.getElementById("outBags").addEventListener("input", updatePgiNet);
function updatePgiNet() {
  const gross = Number(document.getElementById("outGross").value) || 0;
  const net = gross - pgiEmptyWeight;
  document.getElementById("outNetPreview").textContent = net > 0 ? net.toFixed(2) : "0.00";
}

document.getElementById("confirmOutBtn").addEventListener("click", async () => {
  if (!pgiDocId) return;
  const gross = Number(document.getElementById("outGross").value) || 0;
  const bags = Number(document.getElementById("outBags").value) || 0;
  if (!gross) { alert("Please enter the actual (loaded) gross weight."); return; }
  if (!bags) { alert("Please confirm number of bags."); return; }
  if (!confirm("Confirm PGI for this truck?")) return;

  const net = gross - pgiEmptyWeight;

  await updateDoc(doc(db, "deliveries", pgiDocId), {
    status: "Truck Out",
    grossWeight: gross,
    numberOfBags: bags,
    netWeight: net,
    pgiBy: sessionStorage.getItem("employeeName") || currentProfile.name || currentUser.email,
    pgiAt: serverTimestamp()
  });

  alert("✅ PGI recorded. Truck is now on its way to the warehouse.");
  document.getElementById("outResultBox").style.display = "none";
  document.getElementById("searchOutForm").reset();
  pgiDocId = null;
});
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
body { background:#f4f6f9; min-height:100vh; }
#loadingScreen { display:flex; align-items:center; justify-content:center; height:100vh; color:#718096; }
#mainContent { display:none; }
header { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header h1{ font-size:17px; }
.header-actions button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-left:8px; }
.container{ max-width:800px; margin:24px auto; padding:0 16px; }
.tabs{ display:flex; gap:8px; margin-bottom:16px; }
.tabs button{ flex:1; padding:12px; border:none; background:#e2e8f0; color:#4a5568; border-radius:8px; cursor:pointer; font-weight:700; font-size:14px; }
.tabs button.active{ background:#2c5282; color:#fff; }
.card{ background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
.card h2{ font-size:16px; color:#1e3a5f; margin-bottom:14px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
.form-group label{ display:block; font-size:13px; font-weight:600; color:#2d3748; margin-bottom:5px; }
.form-group input, .form-group select{ width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
.form-group input:disabled{ background:#edf2f7; color:#4a5568; }
.unit-btn{ padding:6px 14px; border:1.5px solid #cbd5e0; background:#fff; color:#4a5568; border-radius:6px; cursor:pointer; font-weight:700; font-size:13px; }
.unit-btn.active{ background:#2c5282; color:#fff; border-color:#2c5282; }
.net-box{ grid-column:1/-1; background:#c6f6d5; color:#22543d; border-radius:8px; padding:16px; text-align:center; }
.net-box .label{ font-size:13px; }
.net-box .value{ font-size:26px; font-weight:800; }
#saveInBtn, #confirmOutBtn { width:100%; padding:13px; background:#2c5282; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; margin-top:10px; }
#saveInBtn:disabled{ opacity:.7; cursor:not-allowed; }
.result-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #edf2f7; font-size:14px; }
.result-row b { color:#1e3a5f; }
</style>
</head>
<body>
<div id="loadingScreen">Checking session...</div>
<div id="mainContent">
  <header>
    <h1>⚖️ Weighbridge - Truck In / PGI</h1>
    <div id="operatorName" style="font-size:12px; opacity:.85;"></div>
    <div class="header-actions">
      <button id="backBtn">↩ Main Menu</button>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <button id="tabIn" class="active">🚚 Truck In</button>
      <button id="tabOut">🏁 PGI (Loaded Weight)</button>
    </div>

    <div id="panelIn">
      <form id="truckInForm">
        <div class="card">
          <h2>Truck In</h2>

          <div style="display:flex; gap:8px; align-items:center; margin-bottom:14px;">
            <span style="font-size:13px; font-weight:600; color:#2d3748;">Weight unit:</span>
            <button type="button" id="unitMt" class="unit-btn active">MT</button>
            <button type="button" id="unitKg" class="unit-btn">KG</button>
          </div>

          <div class="grid">
            <div class="form-group">
              <label>Truck No. *</label>
              <input type="text" id="truckInNo" required placeholder="e.g. 12345">
            </div>

            <div class="form-group">
              <label>Delivery No. (auto)</label>
              <input type="text" id="dnDisplay" disabled placeholder="Assigned automatically on save">
            </div>

            <div class="form-group">
              <label>Empty Weight (<span id="emptyWeightUnitLabel">MT</span>) *</label>
              <input type="number" id="emptyWeightIn" step="any" required>
              <button type="button" id="correctEmptyBtn" style="display:none; margin-top:6px; font-size:12px; background:#faf089; border:none; padding:5px 10px; border-radius:6px; cursor:pointer;">✏️ Correct empty weight</button>
            </div>

            <div class="form-group">
              <label>Weighing Method *</label>
              <select id="weighingMethod" required>
                <option value="">Select...</option>
                <option value="Actual">Actual (weigh loaded truck at PGI)</option>
                <option value="Theoretical">Theoretical (by bag count)</option>
              </select>
            </div>

            <div class="form-group">
              <label>Transporter (auto)</label>
              <input type="text" id="transporterField" disabled>
            </div>

            <div class="form-group">
              <label>Vessel (auto)</label>
              <input type="text" id="vesselField" disabled>
            </div>

            <div class="form-group" id="confirmEmptyGroup" style="display:none; grid-column:1/-1;">
              <label style="display:flex; align-items:center; gap:8px; font-weight:600;">
                <input type="checkbox" id="confirmEmptyChk" style="width:auto;">
                I confirm the empty weight shown is correct
              </label>
            </div>

            <div id="truckStatusMsg" style="grid-column:1/-1; font-size:13px; min-height:18px;"></div>
          </div>

          <button type="submit" id="saveInBtn">💾 Save Truck In</button>
        </div>
      </form>
    </div>

    <div id="panelOut" style="display:none;">
      <div class="card">
        <h2>Search Truck for PGI</h2>
        <form id="searchOutForm" class="grid">
          <div class="form-group">
            <label>Truck No.</label>
            <input type="text" id="searchOutInput" required>
          </div>
          <button type="submit" style="align-self:end; padding:10px; background:#2c5282; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:700;">🔍 Search</button>
        </form>
      </div>

      <div class="card" id="outResultBox" style="display:none;">
        <h2>Delivery Details</h2>
        <div class="result-row"><span>Delivery No.</span><b id="outDeliveryNo"></b></div>
        <div class="result-row"><span>Truck No.</span><b id="outTruckNo"></b></div>
        <div class="grid" style="margin-top:12px;">
          <div class="form-group">
            <label>Actual Gross Weight (kg) *</label>
            <input type="number" id="outGross" required placeholder="Read from scale">
          </div>
          <div class="form-group">
            <label>Confirm Number of Bags *</label>
            <input type="number" id="outBags" required>
          </div>
          <div class="net-box">
            <div class="label">Net Weight (kg)</div>
            <div class="value" id="outNetPreview">0.00</div>
          </div>
        </div>
        <button id="confirmOutBtn">✔ Confirm PGI</button>
      </div>
    </div>
  </div>
</div>
<script src="version.js"></script>
</body>
</html>
