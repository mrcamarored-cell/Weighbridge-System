<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck In / Out - Weighbridge</title>
<script type="module">
import {
  requireAuth, requireRole, signOut, auth, db,
  collection, doc, getDoc, getDocs, addDoc, updateDoc, query, where, orderBy, limit,
  serverTimestamp, generateDeliveryNo
} from "./firebase-config.js";

let currentUser, currentProfile;

requireAuth((user, profile) => {
  if (!requireRole(profile, ["weighbridge", "admin"])) return;
  currentUser = user; currentProfile = profile;
  const empName = sessionStorage.getItem("employeeName");
  if (empName) document.getElementById("operatorName").textContent = "Operator: " + empName;
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
  loadBagWeight();
});

document.getElementById("logoutBtn").addEventListener("click", async () => { if(confirm("Sign out?")){ await signOut(auth); window.location.href="index.html"; }});
document.getElementById("backBtn").addEventListener("click", () => window.location.href = "dashboard.html");

// ===== Tabs =====
const tabIn = document.getElementById("tabIn");
const tabOut = document.getElementById("tabOut");
const panelIn = document.getElementById("panelIn");
const panelOut = document.getElementById("panelOut");
tabIn.addEventListener("click", () => switchTab("in"));
tabOut.addEventListener("click", () => switchTab("out"));
function switchTab(which) {
  tabIn.classList.toggle("active", which === "in");
  tabOut.classList.toggle("active", which === "out");
  panelIn.style.display = which === "in" ? "block" : "none";
  panelOut.style.display = which === "out" ? "block" : "none";
}

let defaultBagWeight = 50;
async function loadBagWeight() {
  const snap = await getDocs(collection(db, "settings"));
  if (!snap.empty) defaultBagWeight = Number(snap.docs[0].data().bagWeight) || 50;
}

// ================= TRUCK IN =================
const truckInNo = document.getElementById("truckInNo");
const deliveryNoDisplay = document.getElementById("deliveryNoDisplay");
const emptyWeightIn = document.getElementById("emptyWeightIn");
const emptyWeightGroup = document.getElementById("emptyWeightGroup");
const methodSel = document.getElementById("weighingMethod");
const grossGroup = document.getElementById("grossGroup");
const bagsGroup = document.getElementById("bagsGroup");
const grossWeightIn = document.getElementById("grossWeightIn");
const bagsIn = document.getElementById("bagsIn");
const netWeightIn = document.getElementById("netWeightIn");
const transporterSel = document.getElementById("transporterSel");

let truckFound = false;

truckInNo.addEventListener("blur", async () => {
  const val = truckInNo.value.trim();
  if (!val) return;
  const q = query(collection(db, "trucks"), where("truckNumber", "==", val));
  const snap = await getDocs(q);
  if (!snap.empty) {
    truckFound = true;
    emptyWeightIn.value = snap.docs[0].data().emptyWeightKg;
    emptyWeightGroup.style.display = "block";
    emptyWeightIn.disabled = true;
  } else {
    truckFound = false;
    emptyWeightIn.value = "";
    emptyWeightIn.disabled = false;
    emptyWeightGroup.style.display = "block";
    alert("New truck. Please enter its empty weight.");
  }
  recalcNet();
});

methodSel.addEventListener("change", () => {
  const isActual = methodSel.value === "Actual";
  grossGroup.style.display = isActual ? "block" : "none";
  bagsGroup.style.display = "block";
  recalcNet();
});
grossWeightIn.addEventListener("input", recalcNet);
bagsIn.addEventListener("input", recalcNet);

function recalcNet() {
  const empty = Number(emptyWeightIn.value) || 0;
  let net = 0;
  if (methodSel.value === "Actual") {
    const gross = Number(grossWeightIn.value) || 0;
    net = gross - empty;
  } else if (methodSel.value === "Theoretical") {
    const bags = Number(bagsIn.value) || 0;
    net = bags * defaultBagWeight;
  }
  netWeightIn.textContent = net > 0 ? net.toFixed(2) : "0.00";
}

async function loadTransporters() {
  const snap = await getDocs(collection(db, "transporters"));
  transporterSel.innerHTML = '<option value="">Select or type new...</option>';
  snap.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d.data().name; opt.textContent = d.data().name;
    transporterSel.appendChild(opt);
  });
}
loadTransporters();

document.getElementById("truckInForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const truckNumber = truckInNo.value.trim();
  const emptyWeight = Number(emptyWeightIn.value) || 0;
  const method = methodSel.value;
  const gross = Number(grossWeightIn.value) || 0;
  const bags = Number(bagsIn.value) || 0;
  let transporter = transporterSel.value;
  const newTransporter = document.getElementById("newTransporter").value.trim();
  if (newTransporter) transporter = newTransporter;

  if (!truckNumber || !emptyWeight || !method || !transporter) { alert("Please fill in all required fields."); return; }
  if (method === "Actual" && !gross) { alert("Please enter Gross Weight."); return; }
  if (!bags) { alert("Please enter Number of Bags."); return; }

  const net = method === "Actual" ? (gross - emptyWeight) : (bags * defaultBagWeight);

  const saveBtn = document.getElementById("saveInBtn");
  saveBtn.disabled = true; saveBtn.textContent = "Saving...";

  try {
    // Save truck if new
    if (!truckFound) {
      await addDoc(collection(db, "trucks"), { truckNumber, emptyWeightKg: emptyWeight });
    }
    // Save transporter if new
    if (newTransporter) {
      await addDoc(collection(db, "transporters"), { name: newTransporter });
    }

    const deliveryNo = await generateDeliveryNo();

    await addDoc(collection(db, "deliveries"), {
      deliveryNo, truckNumber, emptyWeight,
      weighingMethod: method,
      grossWeight: method === "Actual" ? gross : null,
      numberOfBags: bags,
      netWeight: net,
      transporter,
      status: "Truck In",
      truckInBy: sessionStorage.getItem("employeeName") || currentProfile.name || currentUser.email,
      truckInAt: serverTimestamp(),
      createdAt: serverTimestamp()
    });

    alert("✅ Truck In saved. Delivery No: " + deliveryNo);
    document.getElementById("truckInForm").reset();
    emptyWeightGroup.style.display = "none";
    grossGroup.style.display = "none";
    bagsGroup.style.display = "none";
    netWeightIn.textContent = "0.00";
  } catch (err) {
    console.error(err);
    alert("Error: " + err.message);
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = "💾 Save Truck In";
  }
});

// ================= TRUCK OUT =================
document.getElementById("searchOutForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const val = document.getElementById("searchOutInput").value.trim();
  if (!val) return;

  const q = query(
    collection(db, "deliveries"),
    where("truckNumber", "==", val),
    where("status", "in", ["Truck In", "Loading"]),
    orderBy("createdAt", "desc"),
    limit(1)
  );
  const snap = await getDocs(q);
  const resultBox = document.getElementById("outResultBox");

  if (snap.empty) {
    resultBox.style.display = "none";
    alert("No active delivery found for this truck (must be status Truck In or Loading).");
    return;
  }

  const docSnap = snap.docs[0];
  const data = docSnap.data();
  document.getElementById("outDeliveryNo").textContent = data.deliveryNo;
  document.getElementById("outTruckNo").textContent = data.truckNumber;
  document.getElementById("outBags").textContent = data.numberOfBags;
  document.getElementById("outNet").textContent = (Number(data.netWeight)||0).toFixed(2);
  resultBox.style.display = "block";
  resultBox.dataset.docId = docSnap.id;
});

document.getElementById("confirmOutBtn").addEventListener("click", async () => {
  const resultBox = document.getElementById("outResultBox");
  const docId = resultBox.dataset.docId;
  if (!docId) return;
  if (!confirm("Confirm Truck Out?")) return;

  await updateDoc(doc(db, "deliveries", docId), {
    status: "Truck Out",
    truckOutBy: sessionStorage.getItem("employeeName") || currentProfile.name || currentUser.email,
    truckOutAt: serverTimestamp()
  });

  alert("✅ Truck Out recorded.");
  resultBox.style.display = "none";
  document.getElementById("searchOutForm").reset();
});
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
body { background:#f4f6f9; min-height:100vh; }
#loadingScreen { display:flex; align-items:center; justify-content:center; height:100vh; color:#718096; }
#mainContent { display:none; }
header { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header h1{ font-size:17px; }
.header-actions button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-left:8px; }
.container{ max-width:800px; margin:24px auto; padding:0 16px; }
.tabs{ display:flex; gap:8px; margin-bottom:16px; }
.tabs button{ flex:1; padding:12px; border:none; background:#e2e8f0; color:#4a5568; border-radius:8px; cursor:pointer; font-weight:700; font-size:14px; }
.tabs button.active{ background:#2c5282; color:#fff; }
.card{ background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
.card h2{ font-size:16px; color:#1e3a5f; margin-bottom:14px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
.form-group label{ display:block; font-size:13px; font-weight:600; color:#2d3748; margin-bottom:5px; }
.form-group input, .form-group select{ width:100%; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
.net-box{ grid-column:1/-1; background:#c6f6d5; color:#22543d; border-radius:8px; padding:16px; text-align:center; }
.net-box .label{ font-size:13px; }
.net-box .value{ font-size:26px; font-weight:800; }
#saveInBtn, #confirmOutBtn { width:100%; padding:13px; background:#2c5282; color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; margin-top:10px; }
#saveInBtn:disabled{ opacity:.7; }
.result-row{ display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #edf2f7; font-size:14px; }
.result-row b { color:#1e3a5f; }
</style>
</head>
<body>
<div id="loadingScreen">Checking session...</div>
<div id="mainContent">
  <header>
    <h1>⚖️ Weighbridge - Truck In / Out</h1>
    <div id="operatorName" style="font-size:12px; opacity:.85;"></div>
    <div class="header-actions">
      <button id="backBtn">↩ Main Menu</button>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <button id="tabIn" class="active">🚚 Truck In</button>
      <button id="tabOut">🏁 Truck Out</button>
    </div>

    <div id="panelIn">
      <form id="truckInForm">
        <div class="card">
          <h2>Truck In</h2>
          <div class="grid">
            <div class="form-group">
              <label>Truck No. *</label>
              <input type="text" id="truckInNo" required placeholder="e.g. 12345">
            </div>
            <div class="form-group" id="emptyWeightGroup" style="display:none;">
              <label>Empty Weight (kg) *</label>
              <input type="number" id="emptyWeightIn" required>
            </div>
            <div class="form-group">
              <label>Weighing Method *</label>
              <select id="weighingMethod" required>
                <option value="">Select...</option>
                <option value="Actual">Actual (weigh truck)</option>
                <option value="Theoretical">Theoretical (by bag count)</option>
              </select>
            </div>
            <div class="form-group" id="grossGroup" style="display:none;">
              <label>Gross Weight (kg) *</label>
              <input type="number" id="grossWeightIn">
            </div>
            <div class="form-group" id="bagsGroup" style="display:none;">
              <label>Number of Bags *</label>
              <input type="number" id="bagsIn">
            </div>
            <div class="form-group">
              <label>Transporter *</label>
              <select id="transporterSel"></select>
            </div>
            <div class="form-group">
              <label>Or New Transporter Name</label>
              <input type="text" id="newTransporter" placeholder="Leave empty if selected above">
            </div>
            <div class="net-box">
              <div class="label">Net Weight (kg)</div>
              <div class="value" id="netWeightIn">0.00</div>
            </div>
          </div>
          <button type="submit" id="saveInBtn">💾 Save Truck In</button>
        </div>
      </form>
    </div>

    <div id="panelOut" style="display:none;">
      <div class="card">
        <h2>Search Truck to Check Out</h2>
        <form id="searchOutForm" class="grid">
          <div class="form-group">
            <label>Truck No.</label>
            <input type="text" id="searchOutInput" required>
          </div>
          <button type="submit" style="align-self:end; padding:10px; background:#2c5282; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:700;">🔍 Search</button>
        </form>
      </div>

      <div class="card" id="outResultBox" style="display:none;">
        <h2>Delivery Details</h2>
        <div class="result-row"><span>Delivery No.</span><b id="outDeliveryNo"></b></div>
        <div class="result-row"><span>Truck No.</span><b id="outTruckNo"></b></div>
        <div class="result-row"><span>Number of Bags</span><b id="outBags"></b></div>
        <div class="result-row"><span>Net Weight (kg)</span><b id="outNet"></b></div>
        <button id="confirmOutBtn">✔ Confirm Truck Out</button>
      </div>
    </div>
  </div>
</div>
<script src="version.js"></script>
</body>
</html>
