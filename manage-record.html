<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Records</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, getDocs, deleteDoc, updateDoc, doc, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD8vEIq7vPDE3EXdZLBPr3gjygZN9MpQgs",
  authDomain: "weighbridge-system-ee0b0.firebaseapp.com",
  projectId: "weighbridge-system-ee0b0",
  storageBucket: "weighbridge-system-ee0b0.firebasestorage.app",
  messagingSenderId: "1087988339377",
  appId: "1:1087988339377:web:3fedc03a481e786b384890"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, (user) => {
  if (!user) { window.location.href = "index.html"; return; }
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("mainContent").style.display = "block";
});
document.getElementById("logoutBtn").addEventListener("click", async () => { if(confirm("Sign out?")){ await signOut(auth); window.location.href="index.html"; }});
document.getElementById("backBtn").addEventListener("click", () => window.location.href = "dashboard.html");

document.getElementById("searchForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const truckNumber = document.getElementById("searchTruck").value.trim();
  if (!truckNumber) { alert("Please enter a truck number to search"); return; }

  const q = query(collection(db, "weightReports"), where("truckNumber", "==", truckNumber));
  const snap = await getDocs(q);

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  if (snap.empty) {
    tbody.innerHTML = "<tr><td colspan='6'>No results found</td></tr>";
    return;
  }

  snap.forEach(d => {
    const r = d.data();
    const date = r.createdAt ? r.createdAt.toDate().toLocaleString("en-US") : "—";
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${date}</td>
      <td>${r.truckNumber}</td>
      <td>${r.shipmentType}</td>
      <td>${(Number(r.tons)||0).toFixed(3)}</td>
      <td>${r.status || ""}</td>
      <td>
        <button class="doneBtn" data-id="${d.id}">✔ Mark Done</button>
        <button class="delBtn" data-id="${d.id}">🗑 Delete</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  document.querySelectorAll(".delBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      const pass = prompt("Enter supervisor password to confirm deletion:");
      if (pass === null) return;
      const ok = await verifySupervisor(pass);
      if (!ok) { alert("Incorrect password."); return; }
      if (confirm("Are you sure you want to delete this?")) {
        await deleteDoc(doc(db, "weightReports", btn.dataset.id));
        document.getElementById("searchForm").dispatchEvent(new Event("submit"));
      }
    });
  });

  document.querySelectorAll(".doneBtn").forEach(btn => {
    btn.addEventListener("click", async () => {
      await updateDoc(doc(db, "weightReports", btn.dataset.id), { status: "Done" });
      document.getElementById("searchForm").dispatchEvent(new Event("submit"));
    });
  });
});

async function verifySupervisor(pass) {
  const q = query(collection(db, "users"), where("password", "==", pass), where("role", "==", "admin"));
  const snap = await getDocs(q);
  return !snap.empty;
}
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Arial,sans-serif; }
body { background:#f4f6f9; min-height:100vh; }
#loadingScreen { display:flex; align-items:center; justify-content:center; height:100vh; color:#718096; }
#mainContent { display:none; }
header { background:linear-gradient(135deg,#1e3a5f,#2c5282); color:#fff; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
header h1{ font-size:17px; }
.header-actions button{ background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:6px; cursor:pointer; font-size:13px; margin-left:8px; }
.container{ max-width:1000px; margin:24px auto; padding:0 16px; }
.card{ background:#fff; border-radius:10px; padding:22px; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-bottom:20px; }
.card h2{ font-size:16px; color:#1e3a5f; margin-bottom:14px; }
.form-row{ display:flex; gap:12px; }
.form-row input{ flex:1; padding:10px 12px; border:1.5px solid #e2e8f0; border-radius:7px; font-size:14px; }
.form-row button{ padding:10px 20px; background:#2c5282; color:#fff; border:none; border-radius:7px; cursor:pointer; font-weight:700; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
th,td{ padding:9px; text-align:left; border-bottom:1px solid #edf2f7; }
th{ background:#f8fafc; color:#4a5568; }
.delBtn{ background:#fed7d7; color:#822727; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px; margin-right:6px; }
.doneBtn{ background:#c6f6d5; color:#22543d; border:none; padding:6px 10px; border-radius:6px; cursor:pointer; font-size:12px; }
</style>
</head>
<body>
<div id="loadingScreen">Checking session...</div>
<div id="mainContent">
  <header>
    <h1>🔍 Manage Records</h1>
    <div class="header-actions">
      <button id="backBtn">↩ Main Menu</button>
      <button id="logoutBtn">Sign Out</button>
    </div>
  </header>
  <div class="container">
    <div class="card">
      <h2>Search Record (by Truck Number)</h2>
      <form id="searchForm" class="form-row">
        <input type="text" id="searchTruck" placeholder="Truck Number" required>
        <button type="submit">🔍 Search</button>
      </form>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>Date</th><th>Truck</th><th>Shipment Type</th><th>Tons</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="6">Use the search above to view records</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
